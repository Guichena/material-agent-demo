[project]
name = "materials-demo-teaching"
version = "0.1.0"
description = "Teaching demo for FastAPI + LangGraph + MCP in a materials workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
