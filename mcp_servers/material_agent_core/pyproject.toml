[project]
name = "material-agent-core-teaching"
version = "0.1.0"
description = "Teaching Material Agent Core MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-material-agent-core-teaching = "material_agent_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_agent_mcp"]
